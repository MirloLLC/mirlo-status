name: Uptime CI
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: upptime/uptime-monitor@v1.41.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          # Notification config is read through getSecret(), which falls back to
          # process.env when SECRETS_CONTEXT is absent. Passing each secret as its
          # own variable keeps every other secret out of the runner.
          # NOTIFICATION_SLACK_WEBHOOK (no _URL) is required by v1.41.3 to register
          # the webhook provider; newer versions dropped that gate.
          NOTIFICATION_SLACK: ${{ secrets.NOTIFICATION_SLACK }}
          NOTIFICATION_SLACK_WEBHOOK: ${{ secrets.NOTIFICATION_SLACK_WEBHOOK }}
          NOTIFICATION_SLACK_WEBHOOK_URL: ${{ secrets.NOTIFICATION_SLACK_WEBHOOK_URL }}
